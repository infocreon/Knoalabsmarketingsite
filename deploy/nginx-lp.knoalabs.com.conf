# nginx site config for lp.knoalabs.com (replaces vercel.json on DigitalOcean).
# Copy to /etc/nginx/sites-available/lp.knoalabs.com, symlink into sites-enabled,
# set the paths marked CHANGE, then: sudo nginx -t && sudo systemctl reload nginx
# HTTPS: run certbot (see docs/REACHABILITY.md). Certbot adds the listen 443 / ssl lines here.
# Prefer to write the HTTPS block yourself? Use nginx-lp.knoalabs.com.https.conf instead.
#
# Every location that sets its own add_header must `include` the security headers (nginx drops the
# server-level ones otherwise). deploy/security-headers.conf is generated: run `node scripts/build-headers.mjs`.

server {
    listen 80;
    listen [::]:80;                           # IPv6: mobile networks (Jio, Airtel 5G) are often IPv6-first. Keep this line.
    server_name lp.knoalabs.com;

    root /var/www/lp.knoalabs.com;            # CHANGE if the repo is cloned elsewhere
    index index.html;
    charset utf-8;
    absolute_redirect off;                    # redirects stay on https after certbot
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/css text/plain text/xml application/javascript application/json application/xml application/manifest+json image/svg+xml;

    # Branded 404 (noindex). Served with the security headers too.
    error_page 404 /404.html;
    location = /404.html {
        internal;
        include /var/www/lp.knoalabs.com/deploy/security-headers.conf;   # CHANGE path if needed
    }

    # security.txt and the Let's Encrypt webroot challenge live under /.well-known/. Must come before the "internals" rule.
    location ^~ /.well-known/ {
        include /var/www/lp.knoalabs.com/deploy/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        default_type text/plain;
        try_files $uri =404;
    }

    # Never serve repo internals (docs, scripts, deploy files, git, package files)
    location ~ (^/\.|^/(deploy|docs|scripts|integrations|node_modules)/|^/(package(-lock)?|vercel)\.json$|\.md$) { return 404; }

    # Redirects (same as vercel.json). $is_args$args keeps ?gclid= / ?utm_* on the redirect.
    location = /privacy { return 302 https://knoalabs.com/privacy-policy/; }
    location = /terms   { return 302 https://knoalabs.com/terms-conditions/; }

    # Friendly aliases that people, QR codes and AI assistants tend to guess. Permanent redirects to the real pages.
    location ~ ^/(cybersecurity|cyber|ethical-hacking)$ { return 301 /cyber-security$is_args$args; }
    location ~ ^/(gen-ai|genai|generative-ai|agentic-ai)$ { return 301 "/Generativeai&Agenticai/online-course$is_args$args"; }
    location = "/Generativeai&Agenticai" { return 301 "/Generativeai&Agenticai/online-course$is_args$args"; }

    # Google Search Console verification file: must be served as-is, no redirect
    location = /google9ecbfd1f9448cc0b.html {
        include /var/www/lp.knoalabs.com/deploy/security-headers.conf;
        try_files $uri =404;
    }

    # Crawler / discovery files: short cache so edits show up within the hour
    location ~ ^/(robots\.txt|sitemap\.xml|llms\.txt|llms-full\.txt|site\.webmanifest)$ {
        include /var/www/lp.knoalabs.com/deploy/security-headers.conf;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        default_type application/manifest+json;   # only used for unknown extensions (.webmanifest); .txt/.xml keep their own type
        try_files $uri =404;
    }

    # Long cache for versioned shared files and page assets
    location ~ ^/(shared/|[^/]+/assets/) {
        include /var/www/lp.knoalabs.com/deploy/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Thank-you pages: keep URLs exactly as they are (Google Ads + GTM), never index
    location ~ ^/[^/]+/thank-you/?$ {
        include /var/www/lp.knoalabs.com/deploy/security-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        rewrite ^(.+)/$ $1 permanent;
        try_files $uri/index.html =404;
    }

    location / {
        include /var/www/lp.knoalabs.com/deploy/security-headers.conf;

        # cleanUrls: /page.html and /page/index.html -> /page ; trailingSlash false: /page/ -> /page
        rewrite ^/index\.html$ / permanent;
        rewrite ^(.+)/index\.html$ $1 permanent;
        rewrite ^(.+)\.html$ $1 permanent;
        rewrite ^(.+)/$ $1 permanent;

        try_files $uri $uri.html $uri/index.html =404;
    }
}
