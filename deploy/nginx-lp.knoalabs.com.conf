# nginx site config for lp.knoalabs.com (replaces vercel.json on DigitalOcean)
# Copy to /etc/nginx/sites-available/lp.knoalabs.com, symlink into sites-enabled,
# set the two paths marked CHANGE, then: sudo nginx -t && sudo systemctl reload nginx
# HTTPS: run certbot (see deploy/DEPLOY.md). Certbot adds the listen 443 / ssl lines here.

server {
    listen 80;
    listen [::]:80;
    server_name lp.knoalabs.com;

    root /var/www/lp.knoalabs.com;            # CHANGE if the repo is cloned elsewhere
    index index.html;
    charset utf-8;
    absolute_redirect off;                    # redirects stay on https after certbot
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml text/plain;

    # Never serve repo internals (docs, deploy files, git)
    location ~ (^/\.|^/deploy/|^/integrations/|\.md$) { return 404; }

    # Redirects (same as vercel.json)
    location = /privacy { return 302 https://knoalabs.com/privacy-policy/; }
    location = /terms   { return 302 https://knoalabs.com/terms-conditions/; }

    # Google Search Console verification file: must be served as-is, no redirect
    location = /google9ecbfd1f9448cc0b.html {
        include /var/www/lp.knoalabs.com/deploy/security-headers.conf;   # CHANGE path if needed
        try_files $uri =404;
    }

    # Long cache for versioned shared files and page assets
    location ~ ^/(shared/|[^/]+/assets/) {
        include /var/www/lp.knoalabs.com/deploy/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Thank-you pages: keep URLs exactly as they are (Google Ads + GTM), never index
    location ~ ^/[^/]+/thank-you/?$ {
        include /var/www/lp.knoalabs.com/deploy/security-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        rewrite ^(.+)/$ $1 permanent;
        try_files $uri/index.html =404;
    }

    location / {
        include /var/www/lp.knoalabs.com/deploy/security-headers.conf;

        # cleanUrls: /page.html and /page/index.html -> /page ; trailingSlash false: /page/ -> /page
        rewrite ^/index\.html$ / permanent;
        rewrite ^(.+)/index\.html$ $1 permanent;
        rewrite ^(.+)\.html$ $1 permanent;
        rewrite ^(.+)/$ $1 permanent;

        try_files $uri $uri.html $uri/index.html =404;
    }
}
