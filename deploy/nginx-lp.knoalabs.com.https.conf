# OPTIONAL: complete HTTPS version of the site config, for when you write the TLS block yourself instead of letting
# certbot edit nginx-lp.knoalabs.com.conf. Use ONE of the two files, never both.
#
#   1. sudo certbot certonly --webroot -w /var/www/lp.knoalabs.com -d lp.knoalabs.com   (needs the port-80 block below running first)
#   2. copy this file to /etc/nginx/sites-available/lp.knoalabs.com, then: sudo nginx -t && sudo systemctl reload nginx
#
# Why it exists: the usual causes of "This site can't be reached" on only some networks are IPv6 (an AAAA record with
# no listener), an expired certificate, and a port-80 -> 443 redirect that never arrives. This file covers all three.

server {
    listen 80;
    listen [::]:80;
    server_name lp.knoalabs.com;

    # Let's Encrypt renewals need plain HTTP on this path. Everything else goes to HTTPS, query string kept.
    location ^~ /.well-known/acme-challenge/ { root /var/www/lp.knoalabs.com; default_type text/plain; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;                     # on nginx >= 1.25.1 you may use a separate line:  http2 on;
    listen [::]:443 ssl http2;                # IPv6. Without this line, IPv6-only users cannot connect.
    server_name lp.knoalabs.com;

    ssl_certificate     /etc/letsencrypt/live/lp.knoalabs.com/fullchain.pem;   # fullchain, not cert.pem: a missing
    ssl_certificate_key /etc/letsencrypt/live/lp.knoalabs.com/privkey.pem;     # intermediate breaks old Android phones
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    root /var/www/lp.knoalabs.com;
    index index.html;
    charset utf-8;
    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/css text/plain text/xml application/javascript application/json application/xml application/manifest+json image/svg+xml;

    error_page 404 /404.html;
    location = /404.html { internal; include /var/www/lp.knoalabs.com/deploy/security-headers.conf; }

    location ^~ /.well-known/ {
        include /var/www/lp.knoalabs.com/deploy/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        default_type text/plain;
        try_files $uri =404;
    }

    location ~ (^/\.|^/(deploy|docs|scripts|integrations|node_modules)/|^/(package(-lock)?|vercel)\.json$|\.md$) { return 404; }

    location = /privacy { return 302 https://knoalabs.com/privacy-policy/; }
    location = /terms   { return 302 https://knoalabs.com/terms-conditions/; }
    location ~ ^/(cybersecurity|cyber|ethical-hacking)$ { return 301 /cyber-security$is_args$args; }
    location ~ ^/(gen-ai|genai|generative-ai|agentic-ai)$ { return 301 "/Generativeai&Agenticai/online-course$is_args$args"; }
    location = "/Generativeai&Agenticai" { return 301 "/Generativeai&Agenticai/online-course$is_args$args"; }

    location = /google9ecbfd1f9448cc0b.html {
        include /var/www/lp.knoalabs.com/deploy/security-headers.conf;
        try_files $uri =404;
    }
    location ~ ^/(robots\.txt|sitemap\.xml|llms\.txt|llms-full\.txt|site\.webmanifest)$ {
        include /var/www/lp.knoalabs.com/deploy/security-headers.conf;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        default_type application/manifest+json;   # only used for unknown extensions (.webmanifest); .txt/.xml keep their own type
        try_files $uri =404;
    }
    location ~ ^/(shared/|[^/]+/assets/) {
        include /var/www/lp.knoalabs.com/deploy/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location ~ ^/[^/]+/thank-you/?$ {
        include /var/www/lp.knoalabs.com/deploy/security-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        rewrite ^(.+)/$ $1 permanent;
        try_files $uri/index.html =404;
    }
    location / {
        include /var/www/lp.knoalabs.com/deploy/security-headers.conf;
        rewrite ^/index\.html$ / permanent;
        rewrite ^(.+)/index\.html$ $1 permanent;
        rewrite ^(.+)\.html$ $1 permanent;
        rewrite ^(.+)/$ $1 permanent;
        try_files $uri $uri.html $uri/index.html =404;
    }
}
